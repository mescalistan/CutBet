<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CutBet</title>
<meta name="description" content="CutBet: app Android di autotutela contro gioco d'azzardo, trading compulsivo e prestiti facili.">
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #1d2430; --muted: #5b6676; --accent: #0d3b66; --line: #dde2e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161d; --card: #19212b; --text: #e6ebf1; --muted: #a3afbd; --accent: #8fb8e8; --line: #2a3542; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  .card { max-width: 560px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; text-align: center; }
  .shield { width: 64px; height: 64px; margin: 0 auto 12px; }
  h1 { margin: 0 0 6px; font-size: 2rem; }
  p { margin: 0 0 18px; color: var(--muted); }
  .links { display: flex; flex-direction: column; gap: 10px; }
  a.btn { display: block; padding: 12px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; border: 1px solid var(--accent); color: var(--accent); }
  a.btn.primary { background: var(--accent); color: var(--card); }
</style>
</head>
<body>
  <main class="card">
    <svg class="shield" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="12" fill="#0d3b66"/>
      <path d="M12 4.5 18 6.8v4.6c0 3.7-2.5 6.9-6 8.1-3.5-1.2-6-4.4-6-8.1V6.8Z" fill="#fff"/>
      <path d="m9.2 12.1 2 2 3.8-4" fill="none" stroke="#0d3b66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>CutBet</h1>
    <p>Autotutela contro gioco d'azzardo, trading compulsivo e prestiti facili, con l'aiuto di un tutore.<br>
       Self-protection against gambling, compulsive trading and easy loans, with the help of a guardian.</p>
    <div class="links">
      <a class="btn primary" href="privacy-policy.html">Privacy Policy (IT / EN)</a>
      <a class="btn" href="https://github.com/mescalistan/CutBet">Codice sorgente / Source code</a>
    </div>
  </main>
</body>
</html>
